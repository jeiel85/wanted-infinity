:root{--ink:#f4f1ea;--dim:#9aa3c7;--hot:#ff3d6e;--gold:#ffd23f;--cyan:#3ff0ff;--bg:#0a0e1f;--panel:rgba(10,12,28,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#tl{position:absolute;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6)}
#time{font-family:'Bungee';font-size:30px;line-height:1}
#sub{margin-top:6px;font-size:13px;font-weight:800;color:var(--dim);display:flex;gap:12px}
#sub b{color:var(--ink)}
#tr{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#stars{display:flex;align-items:center;gap:2px;font-size:36px;line-height:1;transform-origin:right center}
#stars b{color:rgba(255,255,255,.14);-webkit-text-stroke:1.5px rgba(255,255,255,.35);font-weight:400}
#stars b.on{color:var(--gold);-webkit-text-stroke:1.5px #000;text-shadow:0 0 14px rgba(255,200,40,.85),0 2px 0 #000}
#stars .mult{font-family:'Bungee';font-size:38px;color:var(--gold);-webkit-text-stroke:1.5px #000;text-shadow:0 0 18px rgba(255,180,20,.9),0 2px 0 #000;margin-left:4px}
#stars.pop{animation:pop .5s cubic-bezier(.2,2,.4,1)}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#heat{width:150px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9d2e,var(--gold))}
#feed{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:6px}
#feed div{font-weight:800;font-size:14px;padding:3px 9px;border-radius:4px;background:rgba(0,0,0,.55);border-left:3px solid var(--hot);animation:feed 2.6s forwards}
@keyframes feed{0%{opacity:0;transform:translateX(20px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#bars{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;width:min(260px,40vw)}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;width:100%;transform-origin:left;background:linear-gradient(90deg,#1fd67a,#8dff6a)}
.bar.nitro i{background:linear-gradient(90deg,#2a7bff,var(--cyan))}
.bar span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:'Bungee';font-size:9px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 #000}
.bar.low i{background:linear-gradient(90deg,#ff2d55,#ff8a3d);animation:blink .45s infinite alternate}
@keyframes blink{to{opacity:.45}}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
#banner .k{font-family:'Black Han Sans';font-size:clamp(34px,6vw,64px);color:#fff;text-shadow:0 0 24px rgba(255,61,110,.9),0 4px 0 #000}
#banner .e{font-family:'Bungee';font-size:clamp(12px,1.6vw,18px);letter-spacing:.3em;color:var(--gold);margin-top:6px;text-shadow:0 2px 0 #000}
#banner.show{animation:ban 2.6s forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}8%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#bust{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:220px;text-align:center;opacity:0;transition:opacity .15s}
#bust span{font-family:'Black Han Sans';font-size:22px;color:#ff4d6d;text-shadow:0 2px 0 #000;letter-spacing:.1em}
#bust .bar{margin-top:4px;border-color:#ff4d6d}
#bust .bar i{background:#ff2d55}
#hint{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);font-weight:800;font-size:15px;color:#fff;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:6px;white-space:nowrap;transition:opacity .6s}
#topbtns{position:absolute;left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.25);font-size:16px;display:grid;place-items:center}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#touch.hidden{display:none}
#joyZone{position:absolute;left:0;top:25%;bottom:0;width:55%;pointer-events:auto}
#joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);left:100px;bottom:30px;top:auto;opacity:.5}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 16px rgba(63,240,255,.6)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font-family:'Bungee';font-size:13px;letter-spacing:.05em;color:#fff;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4)}
#bNitro{right:max(22px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 10px);width:92px;height:92px;border-color:var(--cyan);box-shadow:0 0 18px rgba(63,240,255,.35) inset}
#bDrift{right:calc(max(22px,env(safe-area-inset-right)) + 104px);bottom:max(22px,env(safe-area-inset-bottom));width:72px;height:72px;border-color:var(--gold)}

.desc{margin-top:12px;font-size:15px;line-height:1.6;color:#dfe3f5;text-shadow:0 1px 3px #000}
.go{margin-top:26px;font-family:'Black Han Sans';font-size:26px;padding:14px 44px;border-radius:999px;background:var(--hot);color:#fff;box-shadow:0 6px 0 #9e1636,0 0 40px rgba(255,61,110,.6);transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #9e1636}
.keys{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-size:13px;color:var(--dim)}

.best{margin-top:16px;font-weight:800;font-size:14px;color:var(--gold)}
.src{margin-top:18px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--dim);text-decoration:none;opacity:.8}.src:hover,.src:focus-visible{color:var(--cyan);opacity:1}
#over{background:rgba(6,8,20,.55);backdrop-filter:blur(2px)}
.card{width:min(440px,100%);background:var(--panel);border:1.5px solid rgba(255,255,255,.16);border-radius:16px;padding:26px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.stamp{font-family:'Bungee';font-size:clamp(46px,11vw,64px);line-height:1;transform:rotate(-5deg);display:inline-block;padding:6px 16px;border:5px solid currentColor;border-radius:8px}
.stamp.busted{color:#4da3ff;text-shadow:0 0 20px rgba(77,163,255,.7)}
.stamp.wrecked{color:var(--hot);text-shadow:0 0 20px rgba(255,61,110,.7)}
.rstars{margin-top:18px;font-family:'Bungee';font-size:54px;color:var(--gold);text-shadow:0 0 22px rgba(255,190,30,.8),0 3px 0 #000}
.rank{font-family:'Black Han Sans';font-size:26px;margin-top:2px}
.newbest{display:inline-block;margin-top:8px;font-family:'Bungee';font-size:13px;background:var(--gold);color:#000;padding:3px 10px;border-radius:4px;animation:blink .5s infinite alternate}
.stats{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:'Bungee';font-size:20px}
.stats span{font-size:12px;color:var(--dim)}
.btns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.btns .go{margin:0;width:100%}
.row{display:flex;gap:10px}
.sec{flex:1;font-weight:800;font-size:15px;padding:12px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2)}
.sec:active{background:rgba(255,255,255,.2)}
#bigStamp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);pointer-events:none;font-family:'Bungee';font-size:clamp(64px,14vw,140px);opacity:0}
#bigStamp.show{animation:stamp 2.2s forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(2.4)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}85%{opacity:1}100%{opacity:0}}
#pause .card{padding:30px}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 16px;border-radius:8px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#fatal{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:16px;line-height:1.7}
@media (max-width:640px){
  #time{font-size:24px}
  #stars{font-size:28px}#stars .mult{font-size:30px}
  #heat{width:110px}
  #bars{top:calc(max(14px,env(safe-area-inset-top)) + 58px);bottom:auto;width:130px;gap:5px}
  .bar{height:11px}
  #topbtns{left:auto;right:max(16px,env(safe-area-inset-right));transform:none;top:auto;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 118px);flex-direction:column}
  #banner{top:16%}
}
